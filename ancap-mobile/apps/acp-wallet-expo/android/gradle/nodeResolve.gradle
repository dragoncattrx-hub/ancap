// Resolve npm packages from the Expo app root (monorepo-safe), not the android/ folder.
def appRootJsPath = rootDir.parentFile.absolutePath.replace("\\", "\\\\")

ext.nodeResolve = { String spec ->
    def nodeBin = gradle.ext.has("nodeExecutable") ? gradle.ext.nodeExecutable : ext.nodeExecutable
    def cmd = [
        nodeBin,
        "--print",
        "require.resolve('${spec}', { paths: ['${appRootJsPath}'] })"
    ]
    def result = cmd.execute(null, rootDir)
    result.waitFor()
    if (result.exitValue() != 0) {
        throw new GradleException("nodeResolve failed for ${spec}: ${result.err.text}")
    }
    return result.text.trim()
}

ext.nodeResolveModule = { String moduleId ->
    def nodeBin = gradle.ext.has("nodeExecutable") ? gradle.ext.nodeExecutable : ext.nodeExecutable
    def cmd = [
        nodeBin,
        "--print",
        "require.resolve('${moduleId}', { paths: ['${appRootJsPath}'] })"
    ]
    def result = cmd.execute(null, rootDir)
    result.waitFor()
    if (result.exitValue() != 0) {
        throw new GradleException("nodeResolveModule failed for ${moduleId}: ${result.err.text}")
    }
    return result.text.trim()
}
