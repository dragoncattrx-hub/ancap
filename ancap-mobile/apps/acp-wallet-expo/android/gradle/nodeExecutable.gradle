// Resolve Node.js for Gradle on hosts where Android Studio does not inherit PATH (common on Windows).
def resolveNodeBinary(File settingsRoot) {
    def nodeEnv = System.getenv("NODE_BINARY")
    if (nodeEnv != null && !nodeEnv.isEmpty()) {
        return nodeEnv
    }

    def localProps = new Properties()
    def localPropsFile = new File(settingsRoot, "local.properties")
    if (!localPropsFile.exists()) {
        def cursor = settingsRoot
        for (int i = 0; i < 6 && cursor != null; i++) {
            def candidate = new File(cursor, "local.properties")
            if (candidate.exists()) {
                localPropsFile = candidate
                break
            }
            cursor = cursor.parentFile
        }
    }
    if (localPropsFile.exists()) {
        localPropsFile.withInputStream { localProps.load(it) }
        def nodeDir = localProps.getProperty("node.dir")
        if (nodeDir) {
            for (def name : ["node.exe", "node"]) {
                def candidate = new File(nodeDir, name)
                if (candidate.exists()) {
                    return candidate.absolutePath
                }
            }
        }
    }

    if (System.getProperty("os.name").toLowerCase().contains("windows")) {
        def programFiles = System.getenv("ProgramFiles")
        if (programFiles) {
            def pfNode = new File(programFiles, "nodejs/node.exe")
            if (pfNode.exists()) {
                return pfNode.absolutePath
            }
        }
        def localAppData = System.getenv("LOCALAPPDATA")
        if (localAppData) {
            def localNode = new File(localAppData, "Programs/node/node.exe")
            if (localNode.exists()) {
                return localNode.absolutePath
            }
        }
        return "node.exe"
    }

    return "node"
}

ext.nodeExecutable = resolveNodeBinary(rootDir)
