services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: ancap
      # Local throwaway dev only: passwordless trust auth avoids committing any default password literal.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "${API_PORT:-8001}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-postgres}@postgres:5432/ancap}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      # In dev mode a key is required but no fail-fast (no prod assets at stake).
      # Generate with: python -c "import secrets; print(secrets.token_urlsafe(64))"
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-only-local}
      CURSOR_SECRET: ${CURSOR_SECRET:-}
      # Keep local/GitHub E2E deterministic: do not inherit host Turnstile secrets into dev compose.
      TURNSTILE_SECRET_KEY: ""
      TURNSTILE_SITE_KEY: ""
      CORS_ORIGINS: ${CORS_ORIGINS:-https://ancap.cloud,https://www.ancap.cloud,http://localhost:3000,http://localhost:3001,http://localhost:3201,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3201}
      PARTICIPATION_GATES_ENABLED: ${PARTICIPATION_GATES_ENABLED:-true}
      # L3 chain anchors (mock | acp | ethereum | solana)
      CHAIN_ANCHOR_DRIVER: ${CHAIN_ANCHOR_DRIVER:-mock}
      ACP_RPC_URL: ${ACP_RPC_URL:-http://host.docker.internal:8545/rpc}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/system/health', timeout=3).read()\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
