services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ancap
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ancap
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      # In dev mode a key is required but no fail-fast (no prod assets at stake).
      # Generate with: python -c "import secrets; print(secrets.token_urlsafe(64))"
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-only-local}
      CURSOR_SECRET: ${CURSOR_SECRET:-}
      # L3 chain anchors (mock | acp | ethereum | solana)
      CHAIN_ANCHOR_DRIVER: ${CHAIN_ANCHOR_DRIVER:-mock}
      ACP_RPC_URL: ${ACP_RPC_URL:-https://acp1.ancap.cloud/rpc}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/system/health', timeout=3).read()\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
