[package]
name = "acp-crypto"
version = "0.3.6"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[features]
default = ["pqc"]
pqc = [
    "pqcrypto-dilithium",
    "pqcrypto-traits",
    "pqc-envelope",
]
pqc-envelope = [
    "ml-kem",
    "sha3",
    "x25519-dalek",
]

[dependencies]
thiserror = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1", features = ["derive"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

ed25519-dalek = { version = "2", features = ["rand_core"] }

# Mnemonic / seed
bip39 = { version = "2", default-features = false, features = ["std", "zeroize"] }

# KDF + AEAD keystore
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = { version = "0.10", features = ["std"] }
base64ct = { version = "1", features = ["std"] }
hex = "0.4"
bech32 = "0.11"

pqcrypto-dilithium = { version = "0.5", optional = true }
pqcrypto-traits = { version = "0.3", optional = true }
ml-kem = { version = "0.3.2", features = ["hazmat", "zeroize"], optional = true }
sha3 = { version = "0.11.0", optional = true }
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "zeroize"], optional = true }
