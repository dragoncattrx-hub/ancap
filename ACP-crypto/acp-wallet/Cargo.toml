[package]
name = "acp-wallet"
version = "0.1.0"
edition = "2021"

[dependencies]
acp-crypto = { path = "../acp-crypto", default-features = true }
acp-mobile-ffi = { path = "../acp-mobile-ffi" }
hex = "0.4"
rand_core = "0.6"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
