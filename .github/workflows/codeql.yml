name: "CodeQL"

on:
  push:
    branches: ["master"]
    paths:
      - "app/**"
      - "frontend-app/**"
      - "ancap-mobile/**"
      - ".github/workflows/**"
  pull_request:
    branches: ["master"]
    paths:
      - "app/**"
      - "frontend-app/**"
      - "ancap-mobile/**"
      - ".github/workflows/**"
  schedule:
    - cron: "0 6 * * 1"  # Weekly on Monday at 06:00 UTC

permissions:
  security-events: write
  contents: read

jobs:
  codeql-python:
    name: "CodeQL — Python"
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: github/codeql-action/init@v4
        with:
          languages: "python"
          queries: "security-and-quality"

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  codeql-javascript:
    name: "CodeQL — JavaScript/TypeScript"
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: github/codeql-action/init@v4
        with:
          languages: "javascript-typescript"
          queries: "security-and-quality"

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  codeql-actions:
    name: "CodeQL — GitHub Actions"
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: github/codeql-action/init@v4
        with:
          languages: "actions"
          queries: "security-and-quality"

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:actions"
