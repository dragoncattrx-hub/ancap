name: Backend CI

on:
  push:
    branches: ["master"]
    paths:
      - "app/**"
      - "tests/**"
      - "alembic/**"
      - "README.md"
      - "LICENSE"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - "MASTER_ROADMAP.md"
      - "docs/**"
      - "scripts/export_ancap_docs.py"
      - "requirements.in"
      - "requirements.txt"
      - "pyproject.toml"
      - "pytest.ini"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "alembic/**"
      - "README.md"
      - "LICENSE"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - "MASTER_ROADMAP.md"
      - "docs/**"
      - "scripts/export_ancap_docs.py"
      - "requirements.in"
      - "requirements.txt"
      - "pyproject.toml"
      - "pytest.ini"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ancap
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ancap"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ancap

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run backend tests
        run: pytest -q

      - name: Docs export / public-trust regression
        run: pytest tests/test_export_ancap_docs.py tests/test_public_trust_docs.py tests/test_ancap_docs_split_ci_guard.py -q

      - name: Security SAST — Bandit
        run: python -m bandit -r app/ -f txt 2>&1 | tee bandit-report.txt

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.txt
          retention-days: 14

      - name: Docker build check
        run: docker build -t ancap:build-check .
