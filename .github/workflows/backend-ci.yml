name: Backend CI

on:
  push:
    branches: ["master"]
    paths:
      - "app/**"
      - "tests/**"
      - "alembic/**"
      - "README.md"
      - "LICENSE"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - "MASTER_ROADMAP.md"
      - "STATUS.md"
      - "docs/**"
      - ".github/CODEOWNERS"
      - ".github/bootstrap/**"
      - ".github/pull_request_template.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/docs-ci.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/secret-hygiene.yml"
      - ".githooks/**"
      - "scripts/bootstrap_ancap_docs_repo.py"
      - "scripts/check_secret_hygiene.py"
      - "scripts/verify-genesis-keystores.py"
      - "ACP-crypto/genesis-addresses.json"
      - "ACP-crypto/genesis-keystore-manifest.json"
      - "scripts/export_ancap_docs.py"
      - "scripts/generate_ancap_docs_live_followup.py"
      - "scripts/generate_secret_hygiene_evidence.py"
      - "scripts/install_git_hooks.py"
      - "scripts/render_secret_rotation_evidence.py"
      - "requirements.in"
      - "requirements.txt"
      - "pyproject.toml"
      - "pytest.ini"
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "alembic/**"
      - "README.md"
      - "LICENSE"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - "MASTER_ROADMAP.md"
      - "STATUS.md"
      - "docs/**"
      - ".github/CODEOWNERS"
      - ".github/bootstrap/**"
      - ".github/pull_request_template.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/docs-ci.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/secret-hygiene.yml"
      - ".githooks/**"
      - "scripts/bootstrap_ancap_docs_repo.py"
      - "scripts/check_secret_hygiene.py"
      - "scripts/verify-genesis-keystores.py"
      - "ACP-crypto/genesis-addresses.json"
      - "ACP-crypto/genesis-keystore-manifest.json"
      - "scripts/export_ancap_docs.py"
      - "scripts/generate_ancap_docs_live_followup.py"
      - "scripts/generate_secret_hygiene_evidence.py"
      - "scripts/install_git_hooks.py"
      - "scripts/render_secret_rotation_evidence.py"
      - "requirements.in"
      - "requirements.txt"
      - "pyproject.toml"
      - "pytest.ini"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ancap
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ancap"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ancap
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run backend tests
        run: pytest -q

      - name: Docs export / public-trust regression
        run: pytest tests/test_export_ancap_docs.py tests/test_public_trust_docs.py tests/test_status_summary.py tests/test_ancap_docs_split_ci_guard.py tests/test_bootstrap_ancap_docs_repo.py tests/test_generate_ancap_docs_live_followup.py -q
        env:
          RUN_ANCAP_DOCS_LIVE_VERIFY: "0"

      - name: Security SAST — Bandit
        run: python -m bandit -r app/ -f txt 2>&1 | tee bandit-report.txt

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.txt
          retention-days: 14

      - name: Docker build check
        run: docker build -t ancap:build-check .
