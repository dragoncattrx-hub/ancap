name: Frontend CI

on:
  push:
    branches: ["master"]
    paths:
      - "frontend-app/**"
      - "ancap-mobile/**"
      - "app/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend-app/**"
      - "ancap-mobile/**"
      - "app/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-app
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test -- --run

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps 2>&1 | tail -5 || true

  test-mobile-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ancap-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ancap-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck --if-present

      - name: Unit tests
        run: npm test


  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Start services (api + postgres + redis)
        run: docker-compose up -d

      - name: Wait for API to be healthy
        run: |
          echo "Waiting for API..." &&           for i in $(seq 1 30); do
            if curl -sf http://localhost:8001/v1/system/health -o /dev/null 2>&1; then
              echo "API is up"
              exit 0
            fi
            echo "Attempt $i/30: API not ready yet..."
            sleep 5
          done
          echo "API failed to start after 150s"
          docker-compose logs api
          exit 1

      - name: Setup Playwright
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npx playwright test
        working-directory: frontend-app
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8001

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend-app/test-results/
          retention-days: 14

      - name: Stop services
        if: always()
        run: docker-compose down -v
