name: Frontend CI

on:
  push:
    branches: ["master"]
    paths:
      - "frontend-app/**"
      - "ancap-mobile/**"
      - "app/**"
      - "alembic/**"
      - "requirements.in"
      - "requirements.txt"
      - "pyproject.toml"
      - "docker-compose.yml"
      - "Dockerfile"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend-app/**"
      - "ancap-mobile/**"
      - "app/**"
      - "alembic/**"
      - "requirements.in"
      - "requirements.txt"
      - "pyproject.toml"
      - "docker-compose.yml"
      - "Dockerfile"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-app
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test -- --run

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  test-mobile-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ancap-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ancap-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck --if-present

      - name: Unit tests
        run: npm test


  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend-app
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Start backend services (api + postgres + redis)
        working-directory: .
        run: PARTICIPATION_GATES_ENABLED=false docker compose up -d postgres redis api

      - name: Wait for API liveness
        working-directory: .
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8001/v1/system/health > /dev/null; then
              echo "API is up"
              exit 0
            fi
            echo "Attempt $i/30: API not ready yet..."
            sleep 5
          done
          echo "API failed to start after 150s"
          docker compose logs api
          exit 1

      - name: Run database migrations
        working-directory: .
        run: docker compose exec -T api alembic upgrade head

      - name: Wait for API readiness
        working-directory: .
        run: |
          for i in $(seq 1 30); do
            if [ "$(curl -fsS http://127.0.0.1:8001/v1/system/ready | python3 -c 'import sys, json; print(json.load(sys.stdin).get("status", ""))')" = "ready" ]; then
              echo "API is ready"
              exit 0
            fi
            echo "Attempt $i/30: API not ready yet..."
            sleep 2
          done
          echo "API failed readiness after migrations"
          docker compose logs api
          exit 1

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8001/v1
          NEXT_PUBLIC_ACP_URL: http://127.0.0.1:8001/acp
        run: npm run build

      - name: Start frontend server
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8001/v1
          NEXT_PUBLIC_ACP_URL: http://127.0.0.1:8001/acp
        run: |
          npm run start > ../frontend-e2e-server.log 2>&1 &
          echo $! > ../frontend-e2e-server.pid

      - name: Wait for frontend to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3001 > /dev/null; then
              echo "Frontend is up"
              exit 0
            fi
            echo "Attempt $i/30: frontend not ready yet..."
            sleep 2
          done
          echo "Frontend failed to start after 60s"
          if [ -f ../frontend-e2e-server.log ]; then
            cat ../frontend-e2e-server.log
          fi
          exit 1

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001
          PLAYWRIGHT_UI_BASE_URL: http://127.0.0.1:3001
          PLAYWRIGHT_API_BASE_URL: http://127.0.0.1:8001/v1
        run: npx playwright test

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend-app/playwright-report/
            frontend-app/test-results/
            frontend-e2e-server.log
          retention-days: 14

      - name: Stop frontend server
        if: always()
        working-directory: .
        run: |
          if [ -f frontend-e2e-server.pid ]; then
            pid=$(cat frontend-e2e-server.pid)
            if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then
              kill "$pid"
            fi
          fi

      - name: Stop backend services
        if: always()
        working-directory: .
        run: docker compose down -v
