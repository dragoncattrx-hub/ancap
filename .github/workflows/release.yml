name: "Release"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-release-check:
    name: Backend release checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ancap
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ancap"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ancap

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Secret hygiene evidence bundle
        id: secret_hygiene_bundle
        continue-on-error: true
        run: python scripts/generate_secret_hygiene_evidence.py --recent-history 20

      - name: Upload secret hygiene report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-hygiene-report
          path: tmp/secret-hygiene-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload secret hygiene history report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-hygiene-history-report
          path: tmp/secret-hygiene-history-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload secret rotation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-rotation-evidence
          path: tmp/secret-rotation-evidence.md
          if-no-files-found: warn
          retention-days: 14

      - name: Secret hygiene regression
        id: secret_hygiene_regression
        continue-on-error: true
        run: pytest tests/test_secret_hygiene.py tests/test_release_security_workflows.py -q

      - name: Enforce secret hygiene gate
        if: always()
        shell: bash
        env:
          BUNDLE_OUTCOME: ${{ steps.secret_hygiene_bundle.outcome }}
          REGRESSION_OUTCOME: ${{ steps.secret_hygiene_regression.outcome }}
        run: |
          if [[ "$BUNDLE_OUTCOME" != "success" || "$REGRESSION_OUTCOME" != "success" ]]; then
            echo "Secret hygiene gate failed (bundle=$BUNDLE_OUTCOME, regression=$REGRESSION_OUTCOME)." >&2
            exit 1
          fi

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run backend tests
        run: pytest -q

      - name: Security SAST — Bandit
        run: python -m bandit -r app/ -f txt

      - name: Docker build check
        run: docker build -t ancap:release-check .

  frontend-release-check:
    name: Frontend release checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-app
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test -- --run

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  draft-release:
    name: Draft GitHub release
    runs-on: ubuntu-latest
    needs:
      - backend-release-check
      - frontend-release-check
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Draft release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          generate_release_notes: true
