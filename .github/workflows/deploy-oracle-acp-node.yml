name: Deploy Oracle ACP node

# Secondary Always Free Ampere A1 full node (eu-zurich-1).
# Requires repo secret ORACLE_ACP_SSH_KEY (private key; never commit).
# Pass the OCI Primary VNIC Public IP via workflow_dispatch input.
# Plan: docs/ORACLE_CLOUD_ACP_NODE_PLAN.md

on:
  workflow_dispatch:
    inputs:
      host_ip:
        description: "OCI instance Public IP (Primary VNIC)"
        required: true
        type: string
      user:
        description: "SSH user (ubuntu for Ubuntu images, opc for Oracle Linux)"
        required: false
        default: ubuntu
        type: string
      peer_rpc:
        description: "Primary peer JSON-RPC URL"
        required: false
        default: https://acp1.ancap.cloud/rpc
        type: string

concurrency:
  group: deploy-oracle-acp-node
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'dragoncattrx-hub/ancap'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Validate Oracle deploy secrets
        env:
          ORACLE_ACP_SSH_KEY: ${{ secrets.ORACLE_ACP_SSH_KEY }}
        run: |
          if [ -z "${ORACLE_ACP_SSH_KEY}" ]; then
            echo "::error::Missing secret ORACLE_ACP_SSH_KEY (paste the Oracle instance private SSH key)."
            exit 1
          fi
          if [ -z "${{ inputs.host_ip }}" ]; then
            echo "::error::host_ip input is required (OCI Public IP)."
            exit 1
          fi

      - name: Bootstrap ARM64 acp-node over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ inputs.host_ip }}
          username: ${{ inputs.user }}
          key: ${{ secrets.ORACLE_ACP_SSH_KEY }}
          timeout: 120s
          command_timeout: 150m
          script_stop: true
          script: |
            set -euo pipefail
            echo "== host arch / memory"
            uname -m
            free -h | head -n 2
            ARCH="$(uname -m)"
            sudo apt-get update -y || sudo dnf -y makecache || true
            if command -v apt-get >/dev/null 2>&1; then
              sudo apt-get install -y --no-install-recommends ca-certificates curl git docker.io openssl
            else
              sudo dnf install -y ca-certificates curl git docker-ce docker-ce-cli containerd.io openssl || sudo yum install -y docker
            fi
            sudo systemctl enable --now docker
            sudo usermod -aG docker "${USER}" || true
            if [ ! -f /etc/acp/acp-node.toml ]; then
              sudo mkdir -p /etc/acp /var/lib/acp-node
              PEER_RPC='${{ inputs.peer_rpc }}'
              TOKEN="$(openssl rand -hex 32)"
              printf '%s\n' \
                'role = "full"' \
                '' \
                '[rpc]' \
                'listen = "0.0.0.0:8545"' \
                "token = \"${TOKEN}\"" \
                '' \
                '[storage]' \
                'data_dir = "/var/lib/acp-node"' \
                '' \
                "peer_rpc_urls = [\"${PEER_RPC}\"]" \
                | sudo tee /etc/acp/acp-node.toml >/dev/null
              echo "Generated host-local RPC token (not printed)."
            fi
            if [ "$ARCH" = "aarch64" ]; then
              mkdir -p "$HOME/ancap-src"
              if [ ! -d "$HOME/ancap-src/.git" ]; then
                git clone --depth 1 https://github.com/dragoncattrx-hub/ancap.git "$HOME/ancap-src"
              else
                git -C "$HOME/ancap-src" fetch --depth 1 origin master
                git -C "$HOME/ancap-src" reset --hard origin/master
              fi
              cd "$HOME/ancap-src/ACP-crypto"
              sudo docker build -f acp-node/Dockerfile -t ancap/acp-node:arm64 .
              IMAGE=ancap/acp-node:arm64
            else
              echo "::notice::x86_64 host — requiring ancap/acp-node:oracle image (ship binary via scripts/deploy-oracle-acp-node.ps1 -Arch amd64)"
              if ! sudo docker image inspect ancap/acp-node:oracle >/dev/null 2>&1; then
                echo "::error::Missing ancap/acp-node:oracle. Bootstrap amd64 with scripts/deploy-oracle-acp-node.ps1 first."
                exit 1
              fi
              IMAGE=ancap/acp-node:oracle
            fi
            sudo docker rm -f acp-node 2>/dev/null || true
            sudo docker run -d --name acp-node --restart unless-stopped \
              -v /var/lib/acp-node:/var/lib/acp-node \
              -v /etc/acp/acp-node.toml:/etc/acp/acp-node.toml:ro \
              -e ACP_DATA_DIR=/var/lib/acp-node \
              -e ACP_PEER_RPC_URLS='${{ inputs.peer_rpc }}' \
              -e ACP_MINER_ENABLED=false \
              -e RUST_LOG=info \
              -p 8545:8545 \
              -p 30333:30333 \
              "$IMAGE" --config /etc/acp/acp-node.toml
            sleep 5
            sudo docker ps --filter name=acp-node
            curl -sS -X POST http://127.0.0.1:8545/rpc \
              -H 'Content-Type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"getblockcount","params":[]}' || true
            echo
            echo "Oracle ACP node bootstrap finished on $(hostname) ($(uname -m))"
