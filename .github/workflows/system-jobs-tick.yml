name: System Jobs Tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-jobs-tick
  cancel-in-progress: false

jobs:
  enqueue-system-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger async system jobs tick
        env:
          SYSTEM_JOBS_TICK_URL: ${{ secrets.ANCAP_SYSTEM_JOBS_TICK_URL }}
          CRON_SECRET: ${{ secrets.ANCAP_CRON_SECRET }}
        run: |
          if [ -z "$SYSTEM_JOBS_TICK_URL" ]; then
            echo "Missing required secret: ANCAP_SYSTEM_JOBS_TICK_URL" >&2
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing required secret: ANCAP_CRON_SECRET" >&2
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" \
            "$SYSTEM_JOBS_TICK_URL"
