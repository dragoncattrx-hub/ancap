name: System Jobs Tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-jobs-tick
  cancel-in-progress: false

jobs:
  enqueue-system-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require configured tick secrets
        env:
          SYSTEM_JOBS_TICK_URL: ${{ secrets.ANCAP_SYSTEM_JOBS_TICK_URL }}
          CRON_SECRET: ${{ secrets.ANCAP_CRON_SECRET }}
        run: |
          if [ -z "$SYSTEM_JOBS_TICK_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::System Jobs Tick requires ANCAP_SYSTEM_JOBS_TICK_URL and ANCAP_CRON_SECRET."
            echo "Tick failed closed: required secrets are not configured for this repository."
            exit 1
          fi

          case "$SYSTEM_JOBS_TICK_URL" in
            */v1/system/jobs/tick/async) ;;
            *)
              echo "ANCAP_SYSTEM_JOBS_TICK_URL must target /v1/system/jobs/tick/async, not the synchronous/manual endpoint."
              exit 1
              ;;
          esac

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" \
            "$SYSTEM_JOBS_TICK_URL"
