name: Deploy ancap.cloud

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      mode:
        description: "deploy mode"
        required: false
        default: recover
        type: choice
        options:
          - recover
          - full

concurrency:
  group: deploy-ancap-cloud
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'dragoncattrx-hub/ancap'
    runs-on: ubuntu-latest
    steps:
      - name: Validate deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.ANCAP_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ANCAP_DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.ANCAP_DEPLOY_SSH_KEY }}
        run: |
          missing=0
          for var in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required secret backing ${var}; deploy cannot run."
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "Deploy failed closed: required ANCAP_DEPLOY_* secrets are not configured."
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          ACCUWEATHER_API_KEY: ${{ secrets.ACCUWEATHER_API_KEY }}
          INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
        with:
          host: ${{ secrets.ANCAP_DEPLOY_HOST }}
          username: ${{ secrets.ANCAP_DEPLOY_USER }}
          key: ${{ secrets.ANCAP_DEPLOY_SSH_KEY }}
          envs: COINGECKO_API_KEY,ACCUWEATHER_API_KEY,INSTANTLY_API_KEY
          # Full rebuild of the prod stack (compose cache allowed; use host prune for clean).
          timeout: 600s
          command_timeout: 70m
          script_stop: false
          script: |
            set -euo pipefail
            cd /opt/ancap-migration/current
            COMPOSE="docker compose -f docker-compose.prod.yml"

            echo "== quick cleanup (no pkill — matches SSH script cmdline)"
            echo "== load $(cut -d' ' -f1-3 /proc/loadavg)"

            for attempt in 1 2 3 4 5; do
              if timeout 120 git fetch origin master; then
                break
              fi
              echo "git fetch failed (attempt ${attempt}/5), retrying..."
              sleep 15
            done
            git reset --hard origin/master || true

            if [ -n "${COINGECKO_API_KEY:-}" ]; then
              echo "== sync CoinGecko key into host .env (value redacted)"
              touch .env
              if grep -q '^COINGECKO_API_KEY=' .env; then
                sed -i "s|^COINGECKO_API_KEY=.*|COINGECKO_API_KEY=${COINGECKO_API_KEY}|" .env
              else
                printf '\nCOINGECKO_ENABLED=true\nCOINGECKO_API_KEY=%s\n' "$COINGECKO_API_KEY" >> .env
              fi
              if ! grep -q '^COINGECKO_ENABLED=' .env; then
                printf 'COINGECKO_ENABLED=true\n' >> .env
              fi
            else
              echo "== COINGECKO_API_KEY GitHub secret not set; market board stays platform-only"
            fi

            if [ -n "${ACCUWEATHER_API_KEY:-}" ]; then
              echo "== sync AccuWeather key into host .env (value redacted)"
              touch .env
              if grep -q '^ACCUWEATHER_API_KEY=' .env; then
                sed -i "s|^ACCUWEATHER_API_KEY=.*|ACCUWEATHER_API_KEY=${ACCUWEATHER_API_KEY}|" .env
              else
                printf '\nACCUWEATHER_ENABLED=true\nACCUWEATHER_API_KEY=%s\nACCUWEATHER_LANGUAGE=en-us\n' "$ACCUWEATHER_API_KEY" >> .env
              fi
              if ! grep -q '^ACCUWEATHER_ENABLED=' .env; then
                printf 'ACCUWEATHER_ENABLED=true\n' >> .env
              fi
            else
              echo "== ACCUWEATHER_API_KEY GitHub secret not set; Earth widget uses interim feed + AccuWeather link"
            fi

            if [ -n "${INSTANTLY_API_KEY:-}" ]; then
              echo "== sync Instantly API key into host .env (value redacted)"
              touch .env
              if grep -q '^INSTANTLY_API_KEY=' .env; then
                sed -i "s|^INSTANTLY_API_KEY=.*|INSTANTLY_API_KEY=${INSTANTLY_API_KEY}|" .env
              else
                printf '\nINSTANTLY_ENABLED=true\nINSTANTLY_API_KEY=%s\nINSTANTLY_API_BASE=https://api.instantly.ai/api/v2\n' "$INSTANTLY_API_KEY" >> .env
              fi
              if ! grep -q '^INSTANTLY_ENABLED=' .env; then
                printf 'INSTANTLY_ENABLED=true\n' >> .env
              else
                sed -i 's|^INSTANTLY_ENABLED=.*|INSTANTLY_ENABLED=true|' .env
              fi
              if ! grep -q '^INSTANTLY_API_BASE=' .env; then
                printf 'INSTANTLY_API_BASE=https://api.instantly.ai/api/v2\n' >> .env
              fi
            else
              echo "== INSTANTLY_API_KEY GitHub secret not set; Instantly sync stays disabled"
            fi

            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "full" ]; then
              sed -i 's/\r$//' scripts/deploy-ancap-cloud.sh 2>/dev/null || true
              bash scripts/deploy-ancap-cloud.sh --skip-git-pull
            else
              echo "== restart services (reload nginx config + existing images)"
              # Recreate proxy so bind-mounted infra/nginx/default.conf is always live.
              timeout 120 $COMPOSE up -d --force-recreate proxy || true
              # Force-recreate api so COINGECKO_* / ACCUWEATHER_* from host .env is picked up by compose.
              timeout 120 $COMPOSE up -d --force-recreate api || true
              timeout 120 $COMPOSE up -d api frontend acp-node proxy || true
              echo "== wait api healthy"
              healthy=0
              for i in $(seq 1 24); do
                if timeout 15 $COMPOSE exec -T api python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/system/health', timeout=3)" 2>/dev/null; then
                  echo "api healthy after ${i} attempts"
                  healthy=1
                  break
                fi
                sleep 5
              done
              if [ "$healthy" -eq 0 ]; then
                echo "== rebuild api (health check failed)"
                timeout 900 $COMPOSE build api
                timeout 120 $COMPOSE up -d api frontend acp-node proxy
                for i in $(seq 1 24); do
                  if timeout 15 $COMPOSE exec -T api python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/system/health', timeout=3)" 2>/dev/null; then
                    echo "api healthy after rebuild attempt ${i}"
                    break
                  fi
                  sleep 5
                done
              fi
              timeout 120 $COMPOSE exec -T api alembic upgrade head 2>&1 | tail -20
              echo "== verify api + same-origin /api gateway"
              timeout 15 $COMPOSE exec -T api sh -c 'curl -sf http://127.0.0.1:8000/v1/system/fees' || true
              echo ""
              proxy_health="$(timeout 15 $COMPOSE exec -T proxy wget -qO- http://127.0.0.1/api/v1/system/health 2>/dev/null || true)"
              echo "proxy /api/v1/system/health -> ${proxy_health:-<empty>}"
              case "$proxy_health" in
                *'"status":"ok"'*|*'"status": "ok"'*) echo "OK same-origin API gateway" ;;
                *)
                  echo "::error::Same-origin /api gateway is broken; login will fail."
                  timeout 15 $COMPOSE exec -T proxy nginx -T 2>&1 | tail -80 || true
                  exit 1
                  ;;
              esac
              market_status="$(timeout 15 $COMPOSE exec -T proxy wget -qO- http://127.0.0.1/api/v1/market/status 2>/dev/null || true)"
              echo "proxy /api/v1/market/status -> ${market_status:-<empty>}"
              timeout 15 $COMPOSE exec -T api sh -c 'curl -sf -o /dev/null -w "treasury %{http_code}\n" http://127.0.0.1:8000/v1/treasury/status' || echo "treasury fail"
              timeout 15 $COMPOSE exec -T api sh -c 'curl -s -X POST "$ACP_RPC_URL" -H "content-type: application/json" -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getblockcount\",\"params\":{}}"' || true
              echo ""
              $COMPOSE ps api acp-node frontend proxy
            fi
