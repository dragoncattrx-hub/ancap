name: Deploy ancap.cloud

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      mode:
        description: "deploy mode"
        required: false
        default: recover
        type: choice
        options:
          - recover
          - full

concurrency:
  group: deploy-ancap-cloud
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'dragoncattrx-hub/ancap'
    runs-on: ubuntu-latest
    steps:
      - name: Validate deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.ANCAP_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ANCAP_DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.ANCAP_DEPLOY_SSH_KEY }}
        run: |
          missing=0
          for var in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required secret backing ${var}; deploy cannot run."
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "Deploy failed closed: required ANCAP_DEPLOY_* secrets are not configured."
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ANCAP_DEPLOY_HOST }}
          username: ${{ secrets.ANCAP_DEPLOY_USER }}
          key: ${{ secrets.ANCAP_DEPLOY_SSH_KEY }}
          # Full no-cache rebuild of the prod stack takes ~20 minutes.
          timeout: 120s
          command_timeout: 45m
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/ancap-migration/current
            COMPOSE="docker compose -f docker-compose.prod.yml"

            echo "== quick cleanup"
            pkill -f 'cargo build' 2>/dev/null || true
            pkill -f 'rustc' 2>/dev/null || true
            echo "== load $(cut -d' ' -f1-3 /proc/loadavg)"

            for attempt in 1 2 3 4 5; do
              if timeout 120 git fetch origin master; then
                break
              fi
              echo "git fetch failed (attempt ${attempt}/5), retrying..."
              sleep 15
            done
            git reset --hard origin/master || true

            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "full" ]; then
              sed -i 's/\r$//' scripts/deploy-ancap-cloud.sh 2>/dev/null || true
              bash scripts/deploy-ancap-cloud.sh --skip-git-pull
            else
              echo "== restart services (existing images)"
              timeout 120 $COMPOSE up -d api frontend acp-node proxy || true
              echo "== wait api healthy"
              healthy=0
              for i in $(seq 1 24); do
                if timeout 15 $COMPOSE exec -T api python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/system/health', timeout=3)" 2>/dev/null; then
                  echo "api healthy after ${i} attempts"
                  healthy=1
                  break
                fi
                sleep 5
              done
              if [ "$healthy" -eq 0 ]; then
                echo "== rebuild api (health check failed)"
                timeout 900 $COMPOSE build api
                timeout 120 $COMPOSE up -d api frontend acp-node proxy
                for i in $(seq 1 24); do
                  if timeout 15 $COMPOSE exec -T api python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/system/health', timeout=3)" 2>/dev/null; then
                    echo "api healthy after rebuild attempt ${i}"
                    break
                  fi
                  sleep 5
                done
              fi
              timeout 120 $COMPOSE exec -T api alembic upgrade head 2>&1 | tail -3 || true
              echo "== verify"
              timeout 15 $COMPOSE exec -T api sh -c 'curl -sf http://127.0.0.1:8000/v1/system/fees' || true
              echo ""
              timeout 15 $COMPOSE exec -T api sh -c 'curl -sf -o /dev/null -w "treasury %{http_code}\n" http://127.0.0.1:8000/v1/treasury/status' || echo "treasury fail"
              timeout 15 $COMPOSE exec -T api sh -c 'curl -s -X POST "$ACP_RPC_URL" -H "content-type: application/json" -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getblockcount\",\"params\":{}}"' || true
              echo ""
              $COMPOSE ps api acp-node frontend
            fi
