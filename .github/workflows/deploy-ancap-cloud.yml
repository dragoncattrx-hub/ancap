name: Deploy ancap.cloud

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-ancap-cloud
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'dragoncattrx-hub/ancap'
    runs-on: ubuntu-latest
    steps:
      - name: Validate deploy secrets
        id: validate_secrets
        env:
          DEPLOY_HOST: ${{ secrets.ANCAP_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ANCAP_DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.ANCAP_DEPLOY_SSH_KEY }}
        run: |
          missing=0
          for var in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [ -z "${!var}" ]; then
              echo "::warning::Missing required secret backing ${var}; deploy step will be skipped."
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.validate_secrets.outputs.can_deploy == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ANCAP_DEPLOY_HOST }}
          username: ${{ secrets.ANCAP_DEPLOY_USER }}
          key: ${{ secrets.ANCAP_DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/ancap-migration/current
            git fetch origin master
            git reset --hard origin/master
            bash scripts/deploy-ancap-cloud.sh --skip-git-pull

      - name: Skip deploy (missing secrets)
        if: steps.validate_secrets.outputs.can_deploy != 'true'
        run: echo "Deploy skipped because required ANCAP_DEPLOY_* secrets are not configured."
