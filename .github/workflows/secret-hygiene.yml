name: "Secret Hygiene"

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      history_range:
        description: "Optional git rev-range override for the history-scan job (blank = clone-safe recent-history sweep)"
        required: false
        default: ""
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: secret-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-tracked-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Secret hygiene scan
        run: python scripts/check_secret_hygiene.py --format json --output tmp/secret-hygiene-report.json

      - name: Upload secret hygiene report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: secret-hygiene-report
          path: tmp/secret-hygiene-report.json
          if-no-files-found: warn
          retention-days: 14

  scan-recent-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Resolve push history range
        if: github.event_name == 'push'
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          history_range=""
          if [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            history_range="$BEFORE_SHA..$AFTER_SHA"
          fi
          if [[ -n "$history_range" ]] && git rev-list --reverse "$history_range" >/dev/null 2>&1; then
            echo "SECRET_HISTORY_RANGE=$history_range" >> "$GITHUB_ENV"
          else
            echo "SECRET_RECENT_HISTORY_COUNT=20" >> "$GITHUB_ENV"
          fi

      - name: Resolve pull-request history range
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          history_range=""
          if [[ -n "$BASE_SHA" && -n "$HEAD_SHA" ]]; then
            history_range="$BASE_SHA..$HEAD_SHA"
          fi
          if [[ -n "$history_range" ]] && git rev-list --reverse "$history_range" >/dev/null 2>&1; then
            echo "SECRET_HISTORY_RANGE=$history_range" >> "$GITHUB_ENV"
          else
            echo "SECRET_RECENT_HISTORY_COUNT=20" >> "$GITHUB_ENV"
          fi

      - name: Resolve scheduled history range
        if: github.event_name == 'schedule'
        shell: bash
        run: echo "SECRET_RECENT_HISTORY_COUNT=20" >> "$GITHUB_ENV"

      - name: Resolve manual history range
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          INPUT_HISTORY_RANGE: ${{ github.event.inputs.history_range }}
        run: |
          history_range="${INPUT_HISTORY_RANGE:-}"
          if [[ -z "${history_range//[[:space:]]/}" ]]; then
            echo "SECRET_RECENT_HISTORY_COUNT=20" >> "$GITHUB_ENV"
          else
            echo "SECRET_HISTORY_RANGE=$history_range" >> "$GITHUB_ENV"
          fi

      - name: Secret hygiene history scan
        shell: bash
        run: |
          if [[ -n "${SECRET_HISTORY_RANGE:-}" ]]; then
            python scripts/check_secret_hygiene.py --history-range "$SECRET_HISTORY_RANGE" --format json --output tmp/secret-hygiene-history-report.json
          else
            python scripts/check_secret_hygiene.py --recent-history "${SECRET_RECENT_HISTORY_COUNT:-20}" --format json --output tmp/secret-hygiene-history-report.json
          fi

      - name: Upload secret hygiene history report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: secret-hygiene-history-report
          path: tmp/secret-hygiene-history-report.json
          if-no-files-found: warn
          retention-days: 14

  secret-hygiene-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Secret hygiene regression
        run: pytest tests/test_secret_hygiene.py tests/test_release_security_workflows.py -q

  render-rotation-evidence:
    if: always()
    needs:
      - scan-tracked-files
      - scan-recent-history
      - secret-hygiene-regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Download tracked secret hygiene report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: secret-hygiene-report
          path: tmp/tracked-report

      - name: Download history secret hygiene report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: secret-hygiene-history-report
          path: tmp/history-report

      - name: Check secret hygiene artifact availability
        id: secret_hygiene_artifacts
        shell: bash
        run: |
          tracked_path="tmp/tracked-report/secret-hygiene-report.json"
          history_path="tmp/history-report/secret-hygiene-history-report.json"
          tracked_exists=false
          history_exists=false
          if [[ -f "$tracked_path" ]]; then
            tracked_exists=true
          fi
          if [[ -f "$history_path" ]]; then
            history_exists=true
          fi
          echo "tracked_exists=$tracked_exists" >> "$GITHUB_OUTPUT"
          echo "history_exists=$history_exists" >> "$GITHUB_OUTPUT"
          if [[ "$tracked_exists" != "true" || "$history_exists" != "true" ]]; then
            echo "Skipping secret rotation evidence render because one or more JSON artifacts are unavailable." >&2
          fi

      - name: Render secret rotation evidence
        if: steps.secret_hygiene_artifacts.outputs.tracked_exists == 'true' && steps.secret_hygiene_artifacts.outputs.history_exists == 'true'
        run: python scripts/render_secret_rotation_evidence.py --tracked-report tmp/tracked-report/secret-hygiene-report.json --history-report tmp/history-report/secret-hygiene-history-report.json --output tmp/secret-rotation-evidence.md

      - name: Upload secret rotation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: secret-rotation-evidence
          path: tmp/secret-rotation-evidence.md
          if-no-files-found: warn
          retention-days: 14
