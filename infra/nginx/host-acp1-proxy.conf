# Host-level nginx (Hestia / system) — sit in front of Cloudflare origin
# and forward acp1.ancap.cloud to the ANCAP compose proxy on :8080.
#
# Installed by scripts/ensure-acp1-host-proxy.sh (not used as Docker conf.d).
# The ensure script may rewrite ssl_certificate paths after generating a
# Full-SSL-compatible self-signed leaf (Cloudflare SSL mode "full").
#
# Cloudflare orange-cloud for acp1.ancap.cloud points at the VPS; without this
# vhost, Hestia's default site returns nginx 404 before Docker ever sees /rpc.

upstream ancap_compose_proxy {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name acp1.ancap.cloud;

    location / {
        proxy_pass http://ancap_compose_proxy;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name acp1.ancap.cloud;

    # Paths filled/overwritten by ensure-acp1-host-proxy.sh
    ssl_certificate     /etc/nginx/ssl/acp1.ancap.cloud.crt;
    ssl_certificate_key /etc/nginx/ssl/acp1.ancap.cloud.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://ancap_compose_proxy;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
