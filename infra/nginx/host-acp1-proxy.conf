# Host-level reference for acp1.ancap.cloud → compose :8080.
#
# NOT installed as a catch-all *:80/:443 drop-in on the Hestia VPS:
# Hestia binds `listen <public-ip>:80|443`, so a parallel `listen 80` never
# wins and only emits conflicting server_name warnings.
#
# Production wiring is applied in-place by scripts/ensure-acp1-host-proxy.sh
# against `/etc/nginx/conf.d/domains/acp1.ancap.cloud*.conf` (replace the
# legacy `proxy_pass ...:18080` exact `/rpc` location with :8080).

# Example shape of the patched Hestia server locations:
#
#   location = /rpc {
#       proxy_pass http://127.0.0.1:8080/rpc;
#       ...
#   }
#   location = /healthz {
#       proxy_pass http://127.0.0.1:8080/healthz;
#       ...
#   }
#   location / {
#       proxy_pass http://127.0.0.1:8080;
#       ...
#   }
