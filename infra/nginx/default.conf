# App on /. /api → backend. Any /w… → 301 to https://$host/… (absolute URL; avoids bad relative Location behind TLS proxies).
# api.ancap.cloud → FastAPI only (Swagger /docs, /openapi.json, /* must not hit Next.js).
#
# Use named upstream blocks (not variable proxy_pass). Variable-based proxy_pass + Docker
# DNS has been observed to mis-route /api/* onto the frontend container, which breaks login.

upstream ancap_api {
    server api:8000;
}

upstream ancap_frontend {
    server frontend:3000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

map $http_x_forwarded_proto $ancap_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $uri $ancap_redir_no_w {
    ~*^/w/(.*)$ /$1;
    ~*^/w$ /;
    default "";
}

# Common security headers (inject via include in every location that sets add_header).
# Keep conservative: no CSP (risks breaking Next.js/Swagger); HSTS safe behind Cloudflare TLS.
# NOTE: nginx add_header only inherits when a location has NO add_header of its own,
# so we repeat this include in each location below.
# File-based includes are not used; keeping the list here for a single source of truth:
#   X-Frame-Options DENY
#   X-Content-Type-Options nosniff
#   Referrer-Policy strict-origin-when-cross-origin
#   Permissions-Policy "geolocation=(), microphone=(), camera=()"
#   Strict-Transport-Security "max-age=31536000; includeSubDomains"

# Public API host: all paths go to uvicorn (not the Next frontend).
server {
    listen 80;
    server_name api.ancap.cloud;

    location / {
        proxy_pass http://ancap_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ancap_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;

        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Ancap-Upstream api always;
    }
}

# Public ACP RPC host: expose host ACP node over /rpc.
server {
    listen 80;
    server_name acp1.ancap.cloud;

    location = /rpc {
        proxy_pass http://acp-node:8545/rpc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ancap_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;

        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        return 404;
    }
}

# Main site: Next.js + /api/* → backend with /api prefix stripped.
server {
    listen 80 default_server;
    server_name ancap.cloud www.ancap.cloud;

    # Swagger at /api/docs loads openapi from same browser origin as absolute /openapi.json.
    location = /openapi.json {
        proxy_pass http://ancap_api/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ancap_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;

        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Ancap-Upstream api always;
    }

    # Trailing-slash form: /api/v1/... → http://ancap_api/v1/...
    location ^~ /api/ {
        proxy_pass http://ancap_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ancap_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;

        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Ancap-Upstream api always;
    }

    # Exact /api → backend root (avoid falling through to Next homepage).
    location = /api {
        proxy_pass http://ancap_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ancap_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;

        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Ancap-Upstream api always;
    }

    # Force canonical URL without /w (absolute https — critical behind Cloudflare / tunnel on :80).
    location = /w {
        return 301 https://$host$ancap_redir_no_w$is_args$args;
    }

    location ^~ /w/ {
        return 301 https://$host$ancap_redir_no_w$is_args$args;
    }

    location ^~ /_next/ {
        proxy_pass http://ancap_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ancap_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
        add_header Cache-Control "private, max-age=31536000, immutable" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Ancap-Upstream frontend always;
        proxy_pass_header ETag;
    }

    location / {
        proxy_pass http://ancap_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ancap_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;

        proxy_hide_header Cache-Control;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
        add_header Cache-Control "private, max-age=0, must-revalidate" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Ancap-Upstream frontend always;
    }
}
