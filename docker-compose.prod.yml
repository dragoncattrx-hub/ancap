services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for docker-compose.prod.yml and must match DATABASE_URL when using the bundled postgres service}
      POSTGRES_DB: ${POSTGRES_DB:-ancap}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file:
      - ./Sicret/bridge-bsc/bridge.env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set for docker-compose.prod.yml, must not use insecure bundled-db default credentials, and must match POSTGRES_PASSWORD when using the bundled postgres service}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for docker-compose.prod.yml and must match DATABASE_URL when using the bundled postgres service}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set for docker-compose.prod.yml}       # required — no fallback; compose/app fail fast if missing
      CURSOR_SECRET: ${CURSOR_SECRET:?CURSOR_SECRET must be set for docker-compose.prod.yml} # required — no fallback; compose/app fail fast if missing
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET must be set for docker-compose.prod.yml}       # required — no fallback; compose/app fail fast if missing
      # L3 chain anchors (mock | acp | ethereum | solana)
      CHAIN_ANCHOR_DRIVER: acp
      # Local prod-like runtime should use the host ACP node directly.
      # Public acp1.ancap.cloud has been flaky/unresolved; keep containers pinned to the host runtime.
      ACP_RPC_URL: http://acp-node:8545/rpc
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-}
      # ACP custodial hot-wallet helper (optional, required to enable /wallet/acp/*)
      ACP_WALLETD_PATH: ${ACP_WALLETD_PATH:-walletd}
      # IMPORTANT: keep bridge runtime pinned to bridge-scoped signer material.
      # If this is sourced from project .env, Docker Compose can override the bridge secret
      # with a generic ACP hot-wallet path and reverse payouts will derive from the wrong wallet.
      ACP_HOT_MNEMONIC_FILE: /run/secrets/bridge-bsc/acp-reserve-mnemonic.txt
      ACP_WALLET_OPERATOR_SECRET: ${ACP_WALLET_OPERATOR_SECRET:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://ancap.cloud}
      PASSWORD_RESET_TOKEN_TTL_MINUTES: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:-30}
      ACP_WALLET_RECOVERY_MASTER_KEY: ${ACP_WALLET_RECOVERY_MASTER_KEY:-}
      PLATFORM_ADMIN_USER_IDS: ${PLATFORM_ADMIN_USER_IDS:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-ANCAP Support}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-15}
      LOGIN_ALERTS_ENABLED: ${LOGIN_ALERTS_ENABLED:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-teneta_claude}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-6}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.tenetauniversity.com}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-45}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1800}
      LLM_DAILY_BUDGET_ACP: ${LLM_DAILY_BUDGET_ACP:-250}
      # Stripe / fiat adapter (optional; keep blank to leave ACP/manual flows only)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_API_BASE: ${STRIPE_API_BASE:-https://api.stripe.com/v1}
      REFERRAL_ONCHAIN_PAYOUT_ENABLED: ${REFERRAL_ONCHAIN_PAYOUT_ENABLED:-false}
      REFERRAL_ONCHAIN_PAYOUT_KEYSTORE_FILE: ${REFERRAL_ONCHAIN_PAYOUT_KEYSTORE_FILE:-}
      REFERRAL_ONCHAIN_PAYOUT_FEE_ACP: ${REFERRAL_ONCHAIN_PAYOUT_FEE_ACP:-}
      # wACP / BSC clearing rail (see docs/bridge-spec-v1.md)
      # IMPORTANT: values come from ./Sicret/bridge-bsc/bridge.env via env_file.
      # Do not mirror them here with ${VAR:-default} fallbacks: compose-level
      # environment entries override env_file and can silently blank live bridge config.
    volumes:
      # Persist ACP hot-wallet mnemonic outside the container.
      # Directory is gitignored by project settings.
      - ./Sicret:/run/secrets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/system/health', timeout=3).read()\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend-app
      dockerfile: Dockerfile
      args:
        # Prefer dedicated API host: public /api on ancap.cloud is stripped by an
        # upstream edge, so same-origin /api/v1 is unreliable for browser auth.
        NEXT_PUBLIC_API_URL: https://api.ancap.cloud/v1
        NEXT_PUBLIC_ACP_URL: /acp
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
        APP_BUILD_ID: ${APP_BUILD_ID:-unknown}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Browser auth/API calls go to api.ancap.cloud (CORS + cookie credentials).
      NEXT_PUBLIC_API_URL: https://api.ancap.cloud/v1
      # SSR fetches hit the API directly over the Docker network (no tunnel round-trip).
      ANCAP_SERVER_API_URL: http://api:8000/v1
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    depends_on:
      api:
        condition: service_healthy

  acp-node:
    build:
      context: ./ACP-crypto
      dockerfile: acp-node/Dockerfile
    environment:
      ACP_DATA_DIR: /var/lib/acp-node
      ACP_RPC_LISTEN: 0.0.0.0:8545
      ACP_CHAIN_ID: 1001
      ACP_DISABLE_CREATOR_VESTING: "1"
      ACP_MINER_REWARD_ADDRESS: acp1qpw9nstpx5vtmqxdxmmud25dk0ae4s6a7cs7n902
    volumes:
      - ./Sicret/acp:/var/lib/acp-node
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_healthy
      acp-node:
        condition: service_started

volumes:
  pgdata:
  redisdata:

